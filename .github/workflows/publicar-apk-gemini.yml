name: Publicar APK Higgsfield Gemini para download direto

on:
  push:
    branches: [build/higgsfield-android]
    paths:
      - .github/workflows/publicar-apk-gemini.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Baixar APK ja compilado e testado
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/diasjean100/Iptv/actions/artifacts/14034631149/zip" \
            --output artifact.zip
          unzip -l artifact.zip
          mkdir -p pacote
          unzip -o artifact.zip -d pacote
          test -s pacote/Open-Higgsfield-AI-Gemini-Corrigido.apk
          file pacote/Open-Higgsfield-AI-Gemini-Corrigido.apk
          sha256sum pacote/Open-Higgsfield-AI-Gemini-Corrigido.apk
          if test -s pacote/SHA256.txt; then
            (cd pacote && sed 's#resultado/##g' SHA256.txt | sha256sum --check)
          fi

      - name: Publicar arquivo APK em release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: diasjean100/Iptv
        shell: bash
        run: |
          set -euo pipefail
          gh release create "higgsfield-gemini-fix-v1" \
            "pacote/Open-Higgsfield-AI-Gemini-Corrigido.apk" \
            --target "build/higgsfield-android" \
            --title "Higgsfield AI + Google Gemini - Android corrigido" \
            --notes "APK de teste com Gemini e Kie.ai. Instalacao e inicializacao verificadas em emulador Android 12; testes no Galaxy A31 e das APIs de IA ainda pendentes. Assinatura debug, sem garantia de atualizacoes no mesmo app ID." \
            --latest=false

      - name: Verificar arquivo publico na release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: diasjean100/Iptv
        shell: bash
        run: |
          gh release view higgsfield-gemini-fix-v1 --json assets,url
