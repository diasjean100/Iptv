name: Higgsfield Android - APK de teste

on:
  push:
    branches:
      - build/higgsfield-android
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Baixar integracao Google do meu repositorio
        uses: actions/checkout@v4
        with:
          path: integracao

      - name: Baixar somente o projeto original
        uses: actions/checkout@v4
        with:
          repository: Autom8AI/Open-Higgsfield-AI
          ref: main
          path: upstream
          persist-credentials: false

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verificar SDK Android do runner
        shell: bash
        run: |
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version || sdkmanager --version

      - name: Verificar arquivos originais e adaptar para Android autonomo
        working-directory: upstream
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main.js')
          s = p.read_text()
          assert "showCheckingScreen();\nhasValidSession().then((sub) => {" in s, 'O gate de login foi alterado pelo upstream.'
          s = s[:s.index('showCheckingScreen();\nhasValidSession().then((sub) => {')] + "localStorage.removeItem('cf_backend');\nbootApp();\n"
          assert "  // Initial Route\n  navigate('library');" in s
          s = s.replace("  // Initial Route\n  navigate('library');", "  // Initial Route\n  navigate('google');", 1)
          assert "const PAGES = {" in s
          s = s.replace("const PAGES = {", "const PAGES = {\n  google: () => import('./components/GoogleStudio.js').then(m => m.GoogleStudio),", 1)
          p.write_text(s)

          p = Path('src/components/Header.js')
          s = p.read_text()
          assert "import { BackendModal } from './BackendModal.js';" in s
          s = s.replace("import { BackendModal } from './BackendModal.js';", "import { AuthModal } from './AuthModal.js';", 1)
          assert "const m = BackendModal();" in s
          s = s.replace("const m = BackendModal();", "const m = AuthModal();", 1)
          assert "rightPart.appendChild(signOutBtn);" in s
          s = s.replace("rightPart.appendChild(signOutBtn);", "// Sem logout Netlify no modo Android", 1)
          assert "const items = ['Library', 'Image', 'Video', 'Characters'];" in s
          s = s.replace("const items = ['Library', 'Image', 'Video', 'Characters'];", "const items = ['Library', 'Image', 'Video', 'Characters', 'Google IA'];", 1)
          assert "'Characters': 'characters'" in s
          s = s.replace("'Characters': 'characters'", "'Characters': 'characters', 'Google IA': 'google'", 1)
          s = s.replace("page === 'characters' ? 'Characters' : null", "page === 'characters' ? 'Characters' : page === 'google' ? 'Google IA' : null", 1)
          p.write_text(s)

          p = Path('src/components/AuthModal.js')
          s = p.read_text()
          assert "modal.querySelector('#backend-login-btn').onclick" in s
          assert "    return overlay;" in s
          s = s.replace("    return overlay;", "    modal.querySelector('#backend-login-btn')?.remove();\n    return overlay;", 1)
          p.write_text(s)
          for source, destination in [('googleApi.mjs', 'src/lib/googleApi.js'), ('GoogleStudio.js', 'src/components/GoogleStudio.js')]:
              src = Path('../integracao/android-patches') / source
              assert src.is_file(), 'Patch ausente: ' + source
              Path(destination).write_text(src.read_text())
          print('Patches aplicados: Google Gemini + Kie.ai')
          PY

      - name: Validar sintaxe e payload Gemini
        shell: bash
        run: |
          node --check integracao/android-patches/googleApi.mjs
          node --check integracao/android-patches/GoogleStudio.js
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const {buildGooglePayload, extractGoogleOutput, makeSafeGoogleDownloadUrl} = await import('./integracao/android-patches/googleApi.mjs');
          const image = buildGooglePayload({kind:'image',model:'gemini-nano-banana-2.1',prompt:'Um teste',images:[],ratio:'1:1'});
          assert.equal(image.response_format.type,'image');
          assert.equal(image.model,'gemini-nano-banana-2.1');
          const video = buildGooglePayload({kind:'video',model:'gemini-omni-1.2-flash',prompt:'Vídeo teste',ratio:'9:16'});
          assert.equal(video.response_format.delivery,'uri');
          const result=extractGoogleOutput({steps:[{type:'model_output',content:[{type:'image',mime_type:'image/png',data:'aGVsbG8='}]}]},'image');
          assert.equal(result.base64,'aGVsbG8=');
          assert.throws(()=>makeSafeGoogleDownloadUrl('https://evil.example/file'));
          console.log('Testes unitários Gemini passaram');
          JS

      - name: Instalar dependencias do projeto
        working-directory: upstream
        run: npm ci --no-audit --no-fund

      - name: Preparar dependencias Android Capacitor
        working-directory: upstream
        run: npm install --no-save --legacy-peer-deps --no-audit --no-fund @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Configurar Capacitor
        working-directory: upstream
        shell: bash
        run: |
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "ai.openhiggsfield.mobile",
            "appName": "Open Higgsfield AI",
            "webDir": "dist",
            "server": { "androidScheme": "https" },
            "plugins": { "CapacitorHttp": { "enabled": true } }
          }
          JSON

      - name: Gerar interface web
        working-directory: upstream
        shell: bash
        run: |
          # A interface Vite e independente do pacote React studio, cujo Babel tem peer dependency faltante.
          npm run vite:build
          test -s dist/index.html

      - name: Preparar projeto nativo Android
        working-directory: upstream
        shell: bash
        run: |
          npx cap add android
          npx cap sync android

      - name: Instalar Android SDK necessario
        shell: bash
        run: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"; fi
          test -x "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Compilar APK Android debug
        working-directory: upstream/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verificar identificacao do APK e renomear
        shell: bash
        run: |
          mkdir -p resultado
          cp upstream/android/app/build/outputs/apk/debug/app-debug.apk resultado/Open-Higgsfield-AI-Google-Gemini.apk
          sha256sum resultado/Open-Higgsfield-AI-Android.apk | tee resultado/SHA256.txt
          ls -lh resultado/

      - name: Publicar APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: Open-Higgsfield-AI-Google-Gemini
          path: resultado/
          if-no-files-found: error
          retention-days: 14
